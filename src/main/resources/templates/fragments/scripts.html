<div th:fragment="scripts">

    <!-- ================== TOAST SYSTEM ================== -->
    <script>

        function toastSystem() {

            return {

                toasts: [],

                init() {

                    window.addEventListener(
                        'toast',
                        (e) => {

                            this.add(
                                e.detail?.message ?? 'Done',
                                e.detail?.type ?? 'info'
                            );

                        }
                    );

                },

                add(message, type = 'success') {

                    const id =
                        Date.now() +
                        Math.random();

                    const icons = {
                        success: '✅',
                        error: '❌',
                        warning: '⚠️',
                        info: 'ℹ️'
                    };

                    this.toasts.push({

                        id,
                        message,
                        type,
                        icon:
                            icons[type] || 'ℹ️',

                        show: true

                    });

                    setTimeout(() => {

                        this.remove(id);

                    }, 3000);

                },

                remove(id) {

                    this.toasts =
                        this.toasts.filter(
                            toast => toast.id !== id
                        );

                },

                toastClasses(type) {

                    return {

                        'bg-green-600 text-white':
                            type === 'success',

                        'bg-red-600 text-white':
                            type === 'error',

                        'bg-yellow-500 text-white':
                            type === 'warning',

                        'bg-blue-600 text-white':
                            type === 'info'

                    };

                }

            };

        }

    </script>

    <!-- ================== GLOBAL HELPERS ================== -->
    <script>

        /**
         * Confirm dialog helper
         */
        function confirmAction(
                message = 'Are you sure?'
        ) {

            return window.confirm(message);

        }

        /**
         * Format currency safely
         */
        function formatCurrency(value) {

            const amount =
                Number(value ?? 0);

            return '$' +
                amount.toFixed(2);

        }

    </script>

</div>
