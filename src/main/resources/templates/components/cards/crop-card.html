<div
        th:fragment="cropCard(crop)"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        xmlns:th="http://www.thymeleaf.org">

    <div class="premium-card overflow-hidden group flex flex-col justify-between h-full bg-white border border-slate-100/80 shadow-md hover:shadow-xl transition-all duration-300">

        <!-- IMAGE WITH BADGES -->
        <div class="h-52 overflow-hidden bg-slate-100 relative">
            <img
                    th:src="${crop.imageUrl != null && !#strings.isEmpty(crop.imageUrl)}
                            ? ${crop.imageUrl}
                            : @{/images/default-crop.jpg}"
                    alt="Crop Image"
                    class="w-full h-full object-cover group-hover:scale-105 transition duration-500 ease-out"/>
            
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/60 via-transparent to-transparent opacity-60"></div>

            <div class="absolute top-3 left-3 flex items-center gap-1.5">
                <span class="badge-premium badge-delivered shadow-sm">
                    🌱 Direct Farm
                </span>
            </div>

            <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between text-white text-xs font-semibold">
                <span class="px-2.5 py-1 rounded-lg glass-dark text-[11px] font-bold border border-white/20 flex items-center gap-1">
                    📍 <span th:text="${crop.location ?: 'Local Farm'}">Location</span>
                </span>
                <span class="px-2.5 py-1 rounded-lg glass-dark text-[11px] font-bold border border-white/20">
                    <span th:text="${crop.quantity}">0</span> Available
                </span>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
                <!-- CATEGORY -->
                <div class="flex items-center justify-between text-[11px] font-bold text-emerald-600 uppercase tracking-wider">
                    <span th:text="${crop.category}">Category</span>
                    <span class="text-slate-400 font-semibold lowercase">verified produce</span>
                </div>

                <!-- NAME -->
                <h3 class="text-lg font-bold text-slate-900 mt-1 hover:text-emerald-600 transition font-display">
                    <a th:href="@{/crops/details/{id}(id=${crop.id})}" th:text="${crop.name}">Crop Name</a>
                </h3>

                <!-- PRICE & STOCK UNIT -->
                <div class="mt-3 flex items-baseline gap-1.5">
                    <span class="text-2xl font-extrabold text-emerald-600 font-display" th:text="'$' + ${#numbers.formatDecimal(crop.price, 1, 2)}">$0.00</span>
                    <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">/ Kg</span>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between gap-2">
                
                <!-- BUY BUTTON (BUYERS ONLY) -->
                <div sec:authorize="hasRole('BUYER')" class="w-full">
                    <form
                            th:action="@{/orders/place}"
                            method="post"
                            class="flex items-center gap-2 w-full">

                        <input
                                type="hidden"
                                name="cropId"
                                th:value="${crop.id}"/>

                        <input
                                type="number"
                                name="quantity"
                                value="1"
                                min="1"
                                th:attr="max=${crop.quantity}"
                                class="w-16 text-center border border-slate-200 rounded-xl text-xs font-bold py-2.5 focus:border-emerald-500 focus:outline-none"/>

                        <button
                                type="submit"
                                class="btn btn-primary py-2.5 px-4 text-xs font-bold flex-1 shadow-md shadow-emerald-500/20">
                            Buy Now
                        </button>

                    </form>
                </div>

                <!-- VIEW DETAIL (GUEST / ANONYMOUS) -->
                <div sec:authorize="isAnonymous()" class="w-full">
                    <a th:href="@{/crops/details/{id}(id=${crop.id})}" class="btn btn-secondary py-2.5 px-4 text-xs font-bold w-full">
                        View Details →
                    </a>
                </div>

                <!-- DELETE BUTTON (FARMERS ONLY) -->
                <div sec:authorize="hasRole('FARMER')" class="w-full flex justify-end">
                    <div
                            th:replace="~{
                            components/buttons/danger ::
                            dangerConfirm(
                                'Delete Listing',
                                '/crops/delete/' + crop.id
                            )}">
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>
