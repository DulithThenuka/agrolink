<div
        th:fragment="cropCard(crop)"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        xmlns:th="http://www.thymeleaf.org">

    <div class="premium-card overflow-hidden group flex flex-col justify-between h-full bg-white border border-slate-100/90 shadow-md hover:shadow-xl transition-all duration-300">

        <!-- IMAGE WITH SMART BADGES -->
        <div class="h-52 overflow-hidden bg-slate-100 relative">
            <img
                    th:src="${crop.imageUrl != null && !#strings.isEmpty(crop.imageUrl)}
                            ? ${crop.imageUrl}
                            : @{/images/default-crop.jpg}"
                    alt="Crop Image"
                    class="w-full h-full object-cover group-hover:scale-105 transition duration-500 ease-out"/>
            
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-transparent to-transparent opacity-70"></div>

            <div class="absolute top-3 left-3 flex flex-col gap-1.5 items-start">
                <span class="badge-premium badge-delivered shadow-md">
                    🧑‍🌾 Verified Farmer
                </span>
                <span class="px-2.5 py-0.5 rounded-full bg-emerald-900/80 backdrop-blur-md text-emerald-200 text-[10px] font-bold border border-emerald-400/30">
                    🌱 Organic: Yes
                </span>
            </div>

            <div class="absolute top-3 right-3">
                <span class="px-2.5 py-1 rounded-full bg-amber-500 text-white font-extrabold text-[10px] uppercase shadow-md">
                    Grade A
                </span>
            </div>

            <div class="absolute bottom-3 left-3 right-3 flex items-center justify-between text-white text-xs font-semibold">
                <span class="px-2.5 py-1 rounded-lg glass-dark text-[11px] font-bold border border-white/20 flex items-center gap-1">
                    📍 <span th:text="${crop.location ?: 'Nuwara Eliya'}">Nuwara Eliya</span>
                </span>
                <span class="px-2.5 py-1 rounded-lg glass-dark text-[11px] font-bold border border-white/20">
                    <span th:text="${crop.quantity}">230</span>kg Available
                </span>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
            <div>
                <!-- CATEGORY & HARVESTED DATE -->
                <div class="flex items-center justify-between text-[11px] font-bold text-emerald-600 uppercase tracking-wider mb-1">
                    <span th:text="${crop.category ?: 'Fresh Produce'}">Category</span>
                    <span class="text-slate-500 font-bold lowercase">Harvested: Today</span>
                </div>

                <!-- NAME -->
                <h3 class="text-lg font-bold text-slate-900 font-display hover:text-emerald-600 transition">
                    <a th:href="@{/crops/details/{id}(id=${crop.id})}" th:text="${crop.name}">Tomato</a>
                </h3>

                <!-- REPUTATION RATING & TRANSACTIONS -->
                <div class="flex items-center justify-between text-xs mt-1.5">
                    <span class="font-bold text-amber-500 flex items-center gap-1">
                        ★★★★★ 4.8
                    </span>
                    <span class="text-slate-400 font-semibold text-[11px]">327 transactions</span>
                </div>

                <!-- PRICE & MARKET AVERAGE COMPARISON -->
                <div class="mt-3.5 p-3 bg-slate-50 rounded-2xl border border-slate-100 space-y-1">
                    <div class="flex items-baseline justify-between">
                        <span class="text-xl font-extrabold text-emerald-600 font-display" th:text="'Rs. ' + ${#numbers.formatDecimal(crop.price, 1, 2)} + '/kg'">Rs. 210/kg</span>
                        <span class="text-[11px] text-slate-400 line-through font-semibold" th:text="'Market: Rs. ' + ${#numbers.formatDecimal(crop.marketAveragePrice, 1, 2)} + '/kg'">Market: Rs. 225/kg</span>
                    </div>
                    <div class="flex justify-between items-center text-[10px] font-bold text-emerald-700">
                        <span>Direct Farm Price</span>
                        <span class="px-2 py-0.5 rounded-full bg-emerald-100">You save: 6.7%</span>
                    </div>
                </div>
            </div>

            <!-- ACTIONS -->
            <div class="pt-3 border-t border-slate-100 flex flex-col gap-2">
                
                <!-- BUYERS ACTIONS -->
                <div sec:authorize="hasRole('BUYER')" class="grid grid-cols-2 gap-2">
                    <form th:action="@{/orders/place}" method="post" class="w-full">
                        <input type="hidden" name="cropId" th:value="${crop.id}"/>
                        <input type="hidden" name="quantity" value="1"/>
                        <button type="submit" class="btn btn-primary py-2.5 px-3 text-xs font-bold w-full shadow-md shadow-emerald-500/20">
                            Buy Now
                        </button>
                    </form>

                    <a th:href="@{/negotiation(cropId=${crop.id})}" class="btn btn-secondary py-2.5 px-3 text-xs font-bold w-full text-center flex items-center justify-center">
                        Make Offer
                    </a>
                </div>

                <!-- GUEST / ANONYMOUS -->
                <div sec:authorize="isAnonymous()" class="w-full">
                    <a th:href="@{/crops/details/{id}(id=${crop.id})}" class="btn btn-secondary py-2.5 px-4 text-xs font-bold w-full text-center block">
                        View Details →
                    </a>
                </div>

                <!-- FARMER DELETE -->
                <div sec:authorize="hasRole('FARMER')" class="w-full flex justify-end">
                    <div th:replace="~{components/buttons/danger :: dangerConfirm('Delete Listing', '/crops/delete/' + crop.id)}"></div>
                </div>

            </div>

        </div>

    </div>

</div>
