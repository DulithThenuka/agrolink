<div
        th:fragment="cropCard(crop)"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        xmlns:th="http://www.thymeleaf.org">

    <div class="premium-card overflow-hidden group flex flex-col justify-between h-full bg-white border border-slate-100">

        <!-- IMAGE -->
        <div class="h-48 overflow-hidden bg-slate-50 relative">
            <img
                    th:src="${crop.imageUrl != null && !#strings.isEmpty(crop.imageUrl)}
                            ? ${crop.imageUrl}
                            : @{/images/default-crop.jpg}"
                    alt="Crop Image"
                    class="w-full h-full object-cover group-hover:scale-105 transition duration-500 ease-in-out"/>
            
            <div class="absolute top-3 left-3 bg-emerald-500 text-white text-[10px] uppercase font-bold tracking-wider px-2.5 py-1 rounded-full shadow-sm">
                Active Listing
            </div>
        </div>

        <!-- CONTENT -->
        <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
                <!-- CATEGORY + LOCATION -->
                <div class="flex items-center gap-1.5 text-[10px] font-bold text-emerald-600 uppercase tracking-widest">
                    <span th:text="${crop.category}">Category</span>
                    <span>•</span>
                    <span th:text="${crop.location}">Location</span>
                </div>

                <!-- NAME -->
                <h3 class="text-base font-bold text-slate-800 mt-1.5 hover:text-emerald-600 transition font-display">
                    <a th:href="@{/crops/details/{id}(id=${crop.id})}" th:text="${crop.name}">Crop Name</a>
                </h3>

                <!-- PRICE -->
                <div class="mt-2.5 flex items-baseline gap-1">
                    <span class="text-xl font-extrabold text-emerald-600" th:text="'$' + ${crop.price}">$0.00</span>
                    <span class="text-xs text-slate-400 font-semibold">/ unit</span>
                </div>

                <!-- QUANTITY -->
                <p class="text-xs text-slate-400 font-semibold mt-1" th:text="'Stock available: ' + ${crop.quantity}">
                    Stock available: 0
                </p>
            </div>

            <!-- ACTIONS -->
            <div class="mt-5 pt-4 border-t border-slate-100/60 flex items-center justify-between">
                
                <!-- BUY BUTTON (BUYERS ONLY) -->
                <div sec:authorize="hasRole('BUYER')" class="w-full">
                    <form
                            th:action="@{/orders/place}"
                            method="post"
                            class="flex items-center gap-2 w-full">

                        <input
                                type="hidden"
                                name="cropId"
                                th:value="${crop.id}"/>

                        <input
                                type="number"
                                name="quantity"
                                value="1"
                                min="1"
                                th:attr="max=${crop.quantity}"
                                class="w-14 text-center border border-slate-200 rounded-xl text-xs font-bold py-2 focus:border-emerald-500 focus:outline-none"/>

                        <button
                                type="submit"
                                class="btn btn-primary py-2 px-4 text-xs font-bold flex-1 shadow-sm">
                            Buy Now
                        </button>

                    </form>
                </div>

                <!-- VIEW DETAIL (GUEST / DEFAULT) -->
                <div sec:authorize="isAnonymous()" class="w-full">
                    <a th:href="@{/crops/details/{id}(id=${crop.id})}" class="btn btn-secondary py-2 px-4 text-xs w-full">
                        View Crop
                    </a>
                </div>

                <!-- DELETE BUTTON (FARMERS ONLY) -->
                <div sec:authorize="hasRole('FARMER')" class="w-full flex justify-end">
                    <div
                            th:replace="~{
                            components/buttons/danger ::
                            dangerConfirm(
                                'Delete Listing',
                                '/crops/delete/' + crop.id
                            )}">
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>
