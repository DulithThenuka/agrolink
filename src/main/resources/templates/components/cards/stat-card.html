<div th:fragment="statCard(title, value, color)">

    <div class="premium-card p-6 bg-white border border-slate-100 flex items-center justify-between">

        <!-- LEFT CONTENT -->
        <div>
            <!-- TITLE -->
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider" th:text="${title}">
                Title
            </p>

            <!-- VALUE -->
            <h2 class="text-3xl font-extrabold mt-2 font-display text-slate-800" th:text="${value}">
                0
            </h2>
        </div>

        <!-- ICON -->
        <div class="w-12 h-12 flex items-center justify-center rounded-2xl"
             th:classappend="${color == 'green'}
                 ? ' bg-emerald-50 text-emerald-600'
                 : (${color == 'blue'}
                     ? ' bg-blue-50 text-blue-600'
                     : (${color == 'purple'}
                         ? ' bg-purple-50 text-purple-600'
                         : ' bg-slate-50 text-slate-600'))">

            <!-- ICON MAPPING -->
            <span class="text-xl font-bold" th:text="${title == 'Users'} ? '👥' : (${title == 'Crops'} ? '🌾' : (${title == 'Orders'} ? '📦' : '📊'))">
                📊
            </span>

        </div>

    </div>

</div>
