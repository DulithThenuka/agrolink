<div th:fragment="dangerConfirm(text, action)">

    <div x-data="{ open: false }">

        <!-- DELETE BUTTON -->
        <button
                @click="open = true"
                type="button"
                class="inline-flex items-center gap-2 px-4 py-2 rounded-lg
                       bg-red-600 text-white font-medium
                       hover:bg-red-700 active:scale-95 transition">

            🗑
            <span th:text="${text}">
                Delete
            </span>

        </button>

        <!-- MODAL BACKDROP -->
        <div
                x-show="open"
                x-transition
                class="fixed inset-0 z-50 flex items-center justify-center
                       bg-black bg-opacity-40 p-4">

            <!-- MODAL CARD -->
            <div
                    @click.away="open = false"
                    class="bg-white rounded-xl shadow-xl
                           w-full max-w-sm p-6">

                <!-- TITLE -->
                <h2 class="text-lg font-semibold mb-2">
                    Confirm Delete
                </h2>

                <!-- MESSAGE -->
                <p class="text-sm text-gray-500 mb-5">
                    This action cannot be undone.
                </p>

                <!-- ACTIONS -->
                <div class="flex justify-end gap-3">

                    <!-- CANCEL BUTTON -->
                    <button
                            @click="open = false"
                            type="button"
                            class="px-4 py-2 border rounded-lg
                                   hover:bg-gray-100 transition">

                        Cancel

                    </button>

                    <!-- DELETE FORM -->
                    <form
                            th:action="@{${action}}"
                            method="post">

                        <button
                                type="submit"
                                class="px-4 py-2 bg-red-600 text-white
                                       rounded-lg hover:bg-red-700
                                       transition">

                            Delete

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
