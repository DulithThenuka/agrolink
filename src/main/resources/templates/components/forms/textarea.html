<div th:fragment="textarea(label, name, placeholder, value, rows, error)">
    <div class="mb-4">
        <!-- LABEL -->
        <label
                th:for="${name}"
                class="label-premium"
                th:text="${label ?: 'Message'}">
            Message
        </label>

        <!-- TEXTAREA -->
        <textarea
                th:id="${name}"
                th:name="${name}"
                th:placeholder="${placeholder ?: ''}"
                th:text="${value}"
                th:rows="${rows ?: 4}"
                class="input-premium resize-none transition-all duration-200"
                th:classappend="${error != null}
                    ? ' border-red-400 focus:border-red-400 focus:ring-red-100'
                    : ' border-slate-200 focus:border-emerald-500 focus:ring-emerald-100'">
        </textarea>

        <!-- ERROR MESSAGE -->
        <p
                th:if="${error != null}"
                class="text-red-500 text-xs mt-1.5 font-medium"
                th:text="${error}">
            Validation error
        </p>
    </div>
</div>
