<div th:fragment="input(label, name, type, placeholder, value, error)">

    <div class="mb-4">

        <!-- LABEL -->
        <label
                th:for="${name}"
                class="block text-sm
                       font-medium
                       text-gray-600
                       mb-1"

                th:text="${label ?: 'Input'}">

            Input

        </label>

        <!-- INPUT -->
        <input
                th:id="${name}"
                th:type="${type ?: 'text'}"
                th:name="${name}"
                th:value="${value}"
                th:placeholder="${placeholder ?: ''}"

                class="w-full px-3 py-2
                       border rounded-lg
                       focus:ring-2
                       focus:ring-green-500
                       outline-none
                       transition"

                th:classappend="${error != null}
                    ? ' border-red-500'
                    : ' border-gray-300'"/>

        <!-- ERROR MESSAGE -->
        <p
                th:if="${error != null}"
                class="text-red-500
                       text-xs mt-1"

                th:text="${error}">

            Validation error

        </p>

    </div>

</div>
