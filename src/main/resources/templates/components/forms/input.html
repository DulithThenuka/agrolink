<div th:fragment="input(label, name, type, placeholder, value, error)">
    <div class="mb-4">
        <!-- LABEL -->
        <label
                th:for="${name}"
                class="label-premium"
                th:text="${label ?: 'Input'}">
            Input
        </label>

        <!-- INPUT -->
        <input
                th:id="${name}"
                th:type="${type ?: 'text'}"
                th:name="${name}"
                th:value="${value}"
                th:placeholder="${placeholder ?: ''}"
                class="input-premium transition-all duration-200"
                th:classappend="${error != null}
                    ? ' border-red-400 focus:border-red-400 focus:ring-red-100'
                    : ' border-slate-200 focus:border-emerald-500 focus:ring-emerald-100'"/>

        <!-- ERROR MESSAGE -->
        <p
                th:if="${error != null}"
                class="text-red-500 text-xs mt-1.5 font-medium"
                th:text="${error}">
            Validation error
        </p>
    </div>
</div>
