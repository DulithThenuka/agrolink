<div th:fragment="select(label, name, options, selectedValue, error)">
    <div class="mb-4">
        <!-- LABEL -->
        <label
                th:for="${name}"
                class="label-premium"
                th:text="${label ?: 'Select'}">
            Select
        </label>

        <!-- SELECT -->
        <select
                th:id="${name}"
                th:name="${name}"
                class="input-premium bg-white transition-all duration-200"
                th:classappend="${error != null}
                    ? ' border-red-400 focus:border-red-400 focus:ring-red-100'
                    : ' border-slate-200 focus:border-emerald-500 focus:ring-emerald-100'">
            <!-- DEFAULT OPTION -->
            <option value="">Select an option</option>

            <!-- OPTIONS -->
            <option
                    th:each="option : ${options}"
                    th:value="${option}"
                    th:text="${option}"
                    th:selected="${option == selectedValue}">
            </option>
        </select>

        <!-- ERROR -->
        <p
                th:if="${error != null}"
                class="text-red-500 text-xs mt-1.5 font-medium"
                th:text="${error}">
            Validation error
        </p>
    </div>
</div>
