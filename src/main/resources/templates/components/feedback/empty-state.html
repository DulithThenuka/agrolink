<div th:fragment="empty(title, message, actionText=null, actionLink=null)">

    <div
            class="flex flex-col items-center
                   justify-center text-center
                   py-12 px-4">

        <!-- ICON -->
        <div class="text-5xl mb-4">

            📭

        </div>

        <!-- TITLE -->
        <h2
                class="text-lg font-semibold text-gray-700"
                th:text="${title ?: 'No Data Found'}">

            No Data Found

        </h2>

        <!-- MESSAGE -->
        <p
                class="text-sm text-gray-500
                       mt-2 max-w-sm"
                th:text="${message ?: 'There is nothing to display right now.'}">

            Nothing to display

        </p>

        <!-- OPTIONAL ACTION BUTTON -->
        <a
                th:if="${actionText != null && actionLink != null}"

                th:href="@{${actionLink}}"

                class="mt-5 inline-flex items-center
                       px-4 py-2 rounded-lg
                       bg-green-600 text-white
                       hover:bg-green-700
                       transition">

            <span th:text="${actionText}">

                Action

            </span>

        </a>

    </div>

</div>
