<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{
        fragments/head ::
        head('My Orders')
        }">
</head>

<body class="bg-slate-50">

<!-- BASE LAYOUT -->
<div th:replace="~{layout/base :: base('My Orders', ~{::content})}"></div>

<!-- ================== PAGE CONTENT ================== -->
<div th:fragment="content" class="max-w-6xl mx-auto space-y-6 animate-fade-in-up">

    <!-- HEADER -->
    <div class="flex justify-between items-center pb-5 border-b border-slate-200/60">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 font-display">My Orders 📦</h1>
            <p class="text-slate-500 text-sm mt-1">Track purchase order lifecycles and historical trade settlements.</p>
        </div>

        <a th:href="@{/crops}" class="text-xs text-emerald-600 hover:text-emerald-700 font-bold transition">
            Browse Crops →
        </a>
    </div>

    <!-- SUCCESS MESSAGE -->
    <div th:if="${successMessage}" class="mb-6"
         th:replace="~{components/feedback/alert :: alert('success', ${successMessage})}">
    </div>

    <!-- ERROR MESSAGE -->
    <div th:if="${errorMessage}" class="mb-6"
         th:replace="~{components/feedback/alert :: alert('error', ${errorMessage})}">
    </div>

    <!-- EMPTY STATE -->
    <div th:if="${#lists.isEmpty(orders)}">
        <div th:replace="~{components/feedback/empty-state :: empty('No Orders Yet', 'You haven’t placed any orders yet.', 'Browse Crops', '/crops')}"></div>
    </div>

    <!-- TABLE -->
    <div th:unless="${#lists.isEmpty(orders)}" class="premium-table-container">
        <table class="premium-table">
            <thead>
            <tr>
                <th>Crop Name</th>
                <th>Quantity</th>
                <th>Total Price</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td class="font-bold text-slate-800">
                    <a th:href="@{/orders/{id}(id=${order.id})}" class="hover:text-emerald-600 transition flex items-center gap-1.5">
                        <span th:text="${order.cropName ?: (order.crop != null ? order.crop.name : 'Unknown Crop')}">Crop Name</span>
                    </a>
                </td>
                <td class="text-slate-500 font-semibold" th:text="${order.quantity ?: 0}">Quantity</td>
                <td class="font-extrabold text-emerald-600" th:text="'$' + ${order.totalPrice}">$0.00</td>
                <td>
                    <span class="badge-premium font-bold uppercase text-[10px]"
                          th:text="${order.status}"
                          th:classappend="${order.status == 'PENDING' ? 'badge-pending' : (order.status == 'DELIVERED' ? 'badge-delivered' : (order.status == 'CONFIRMED' ? 'badge-confirmed' : 'badge-cancelled'))}">
                        PENDING
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
