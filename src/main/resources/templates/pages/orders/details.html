<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{
        fragments/head ::
        head('Order Details')
}">
</head>

<body>

<!-- BASE LAYOUT -->
<div
        th:replace="~{
        layout/base ::
        base('Order Details', ~{::content})
}">
</div>

<!-- ================== PAGE CONTENT ================== -->
<div
        th:fragment="content"

        class="max-w-4xl mx-auto">

    <!-- HEADER -->
    <div class="mb-6">

        <h1
                class="text-2xl
                       font-bold
                       text-gray-800">

            Order #

            <span
                    th:text="${order.id}">
            </span>

        </h1>

        <p
                class="text-sm
                       text-gray-500">

            Placed on

            <span
                    th:if="${order.createdAt != null}"

                    th:text="${#temporals.format(
                        order.createdAt,
                        'dd MMM yyyy'
                    )}">
            </span>

        </p>

    </div>

    <!-- MAIN CARD -->
    <div
            class="bg-white
                   rounded-xl
                   shadow p-6
                   space-y-6">

        <!-- STATUS -->
        <div
                class="flex justify-between
                       items-center">

            <h2
                    class="font-semibold
                           text-gray-700">

                Order Status

            </h2>

            <span
                    class="px-3 py-1
                           text-sm rounded-full"

                    th:text="${order.status}"

                    th:classappend="
                    ${order.status == 'PENDING'}
                    ? ' bg-yellow-100 text-yellow-700' :

                    ${order.status == 'CONFIRMED'}
                    ? ' bg-blue-100 text-blue-700' :

                    ${order.status == 'DELIVERED'}
                    ? ' bg-green-100 text-green-700' :

                    ${order.status == 'CANCELLED'}
                    ? ' bg-red-100 text-red-700' :

                    ' bg-gray-100 text-gray-700'
                    ">
            </span>

        </div>

        <!-- CROP INFO -->
        <div
                class="border-t pt-4">

            <h3
                    class="font-semibold
                           text-gray-700
                           mb-3">

                Crop Details

            </h3>

            <div
                    class="flex items-center
                           gap-4">

                <img
                        th:if="${order.crop != null}"

                        th:src="${order.crop.imageUrl}"

                        alt="Crop"

                        class="w-20 h-20
                               rounded
                               object-cover"/>

                <div>

                    <p
                            class="font-medium
                                   text-gray-800"

                            th:text="${order.crop?.name ?: 'Unknown Crop'}">
                    </p>

                    <p
                            class="text-sm
                                   text-gray-500"

                            th:text="${order.crop?.category ?: '-'}">
                    </p>

                </div>

            </div>

        </div>

        <!-- ORDER INFO -->
        <div
                class="border-t pt-4
                       grid grid-cols-2
                       gap-4 text-sm">

            <div>

                <p class="text-gray-500">
                    Quantity
                </p>

                <p
                        class="font-medium"

                        th:text="${order.quantity ?: 0}">
                </p>

            </div>

            <div>

                <p class="text-gray-500">
                    Total Price
                </p>

                <p
                        class="font-medium
                               text-green-600"

                        th:text="'$' + ${order.totalPrice}">
                </p>

            </div>

        </div>

        <!-- BUYER INFO -->
        <div
                class="border-t pt-4">

            <h3
                    class="font-semibold
                           text-gray-700
                           mb-2">

                Buyer

            </h3>

            <p
                    class="text-gray-800"

                    th:text="${order.buyerEmail
                        ?: order.buyer?.email
                        ?: 'Unknown'}">
            </p>

        </div>

        <!-- ACTIONS -->
        <div
                class="border-t pt-4
                       flex justify-between
                       items-center">

            <a
                    th:href="@{/orders/my}"

                    class="text-gray-500
                           hover:underline">

                ← Back to Orders

            </a>

            <!-- PAY -->
            <a
                    th:if="${order.status == 'PENDING'}"

                    th:href="@{/payment/checkout/{id}(
                        id=${order.id}
                    )}"

                    class="bg-green-600
                           text-white
                           px-5 py-2
                           rounded-lg
                           hover:bg-green-700">

                Pay Now

            </a>

        </div>

    </div>

</div>

</body>
</html>
