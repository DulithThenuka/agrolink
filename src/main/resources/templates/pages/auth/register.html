<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{
        fragments/head ::
        head('Register - AgroLink')
        }">
</head>

<body class="bg-slate-50 font-sans antialiased text-slate-800 flex flex-col min-h-screen relative overflow-x-hidden">

<!-- NAVBAR -->
<div th:replace="~{layout/navbar :: navbar}"></div>

<!-- AMBIENT BACKGROUND GLOW & 3D PARTICLES -->
<div class="absolute inset-0 bg-radial-glow opacity-60 pointer-events-none z-0"></div>
<div id="three-bg" class="absolute inset-0 w-full h-full z-0 pointer-events-none opacity-40"></div>

<!-- MAIN CONTENT -->
<main class="flex-1 flex items-center justify-center py-12 px-4 relative z-10">

    <div class="w-full max-w-md hero-card opacity-0 my-auto">

        <!-- GLASS CARD -->
        <div class="glass p-8 sm:p-10 rounded-3xl shadow-2xl border border-white/80 bg-white/80 backdrop-blur-xl">

            <!-- BRAND BADGE & HEADING -->
            <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-2xl bg-emerald-50 border border-emerald-200/60 text-emerald-600 flex items-center justify-center mx-auto mb-3.5 text-2xl shadow-sm">
                    🌱
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight hero-title font-display">
                    Create Account
                </h2>
                <p class="text-slate-500 text-xs sm:text-sm mt-1 font-medium hero-sub">
                    Join AgroLink direct agricultural network
                </p>
            </div>

            <!-- GLOBAL ERROR -->
            <div th:if="${#fields.hasErrors('*')}" class="mb-4"
                 th:replace="~{
                     components/feedback/alert ::
                     alert('error', 'Please fix the errors indicated below')
                 }">
            </div>

            <!-- FORM -->
            <form th:action="@{/auth/register}" th:object="${user}" method="post" class="space-y-4">

                <!-- NAME -->
                <div class="form-field">
                    <label for="name" class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">
                        Full Name
                    </label>
                    <input id="name" type="text" th:field="*{name}" placeholder="e.g. John Doe" required
                           class="input-premium">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500 text-xs mt-1 font-semibold"></p>
                </div>

                <!-- EMAIL -->
                <div class="form-field">
                    <label for="email" class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">
                        Email Address
                    </label>
                    <input id="email" type="email" th:field="*{email}" placeholder="Enter your email" required
                           class="input-premium">
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-500 text-xs mt-1 font-semibold"></p>
                </div>

                <!-- PASSWORD -->
                <div class="form-field">
                    <label for="password" class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">
                        Password
                    </label>
                    <input id="password" type="password" th:field="*{password}" placeholder="Create password" required
                           class="input-premium">
                    <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-500 text-xs mt-1 font-semibold"></p>
                </div>

                <!-- LOCATION -->
                <div class="form-field">
                    <label for="location" class="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">
                        Location / District
                    </label>
                    <input id="location" type="text" th:field="*{location}" placeholder="City or Area (e.g. Colombo)" required
                           class="input-premium">
                </div>

                <!-- ROLE NOTICE -->
                <div class="form-field bg-emerald-50/70 border border-emerald-200/60 rounded-2xl p-3.5 text-xs text-emerald-900 font-semibold flex items-center gap-2">
                    <span class="text-base">💡</span>
                    <span>Standard registration creates a <strong class="text-emerald-700 font-bold">Buyer Account</strong> by default.</span>
                </div>

                <!-- SUBMIT -->
                <button type="submit"
                        class="w-full btn btn-primary py-3.5 rounded-xl text-sm font-bold mt-2 shadow-lg shadow-emerald-500/25">
                    Register Account →
                </button>

            </form>

            <!-- LOGIN LINK -->
            <div class="pt-6 mt-6 border-t border-slate-200/60 text-center">
                <p class="text-xs text-slate-500 font-medium">
                    Already have an account?
                    <a th:href="@{/auth/login}" class="text-emerald-600 hover:text-emerald-700 font-bold underline underline-offset-4 ml-1">
                        Sign In
                    </a>
                </p>
            </div>

        </div>

    </div>

</main>

<!-- FOOTER -->
<div th:replace="~{layout/footer :: footer}"></div>

<!-- SCRIPTS -->
<div th:replace="~{fragments/scripts :: scripts}"></div>

<!-- THREE.JS & GSAP INTEGRATION -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // GSAP Animations
        gsap.to(".hero-card", {
            duration: 0.8,
            opacity: 1,
            y: 0,
            scale: 1,
            ease: "power3.out"
        });
        
        gsap.from(".hero-title", {
            duration: 0.8,
            y: -15,
            opacity: 0,
            delay: 0.15,
            ease: "back.out(1.4)"
        });

        gsap.from(".hero-sub", {
            duration: 0.6,
            opacity: 0,
            delay: 0.3,
            ease: "power2.out"
        });

        gsap.from(".form-field", {
            duration: 0.6,
            y: 12,
            opacity: 0,
            stagger: 0.1,
            delay: 0.4,
            ease: "power3.out"
        });

        // Three.js Ambient Particle Background
        const container = document.getElementById('three-bg');
        if (!container) return;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0xf8fafc, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const particleCount = 140;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 18;
            positions[i + 1] = (Math.random() - 0.5) * 12;
            positions[i + 2] = (Math.random() - 0.5) * 10;
            velocities.push({
                y: Math.random() * 0.012 + 0.004,
                x: (Math.random() - 0.5) * 0.008
            });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: 0x10b981,
            size: 0.14,
            transparent: true,
            opacity: 0.45
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            particles.rotation.y = elapsedTime * 0.015;

            const pos = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                pos[idx + 1] += velocities[i].y;
                pos[idx] += Math.sin(elapsedTime + i) * 0.002;

                if (pos[idx + 1] > 6) {
                    pos[idx + 1] = -6;
                    pos[idx] = (Math.random() - 0.5) * 18;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();
    });
</script>

</body>
</html>
