<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{
        fragments/head ::
        head('Register')
        }">
</head>

<body class="relative flex items-center justify-center min-h-screen px-4 overflow-hidden bg-gradient-to-br from-slate-950 via-emerald-950 to-teal-950 py-12">

<!-- 3D BACKGROUND CANVAS -->
<div id="three-bg" class="absolute inset-0 w-full h-full z-0 pointer-events-none"></div>

<div class="relative w-full max-w-md z-10 hero-card opacity-0 my-auto">

    <!-- GLASS CARD -->
    <div class="bg-slate-900/40 backdrop-blur-md rounded-3xl shadow-2xl p-8 border border-white/10">

        <!-- TITLE -->
        <h2 class="text-3xl font-bold text-center text-white mb-2 tracking-wide hero-title font-display">
            Create Account <span class="text-emerald-400">🌱</span>
        </h2>

        <p class="text-center text-slate-300/80 text-sm mb-6 hero-sub">
            Join AgroLink today
        </p>

        <!-- GLOBAL ERROR -->
        <div th:if="${#fields.hasErrors('*')}"
             th:replace="~{
                 components/feedback/alert ::
                 alert('error', 'Please fix the errors below')
             }">
        </div>

        <!-- FORM -->
        <form th:action="@{/auth/register}" th:object="${user}" method="post" class="space-y-4">

            <!-- NAME -->
            <div class="form-field">
                <label for="name" class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Full Name</label>
                <input id="name" type="text" th:field="*{name}" placeholder="Enter your full name" required
                       class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200 text-sm">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-400 text-xs mt-1"></p>
            </div>

            <!-- EMAIL -->
            <div class="form-field">
                <label for="email" class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Email Address</label>
                <input id="email" type="email" th:field="*{email}" placeholder="Enter your email" required
                       class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200 text-sm">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-red-400 text-xs mt-1"></p>
            </div>

            <!-- PASSWORD -->
            <div class="form-field">
                <label for="password" class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Password</label>
                <input id="password" type="password" th:field="*{password}" placeholder="Enter password" required
                       class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200 text-sm">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-red-400 text-xs mt-1"></p>
            </div>

            <!-- LOCATION -->
            <div class="form-field">
                <label for="location" class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">Location</label>
                <input id="location" type="text" th:field="*{location}" placeholder="City / Area" required
                       class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200 text-sm">
            </div>

            <!-- ROLE NOTICE -->
            <div class="form-field bg-slate-950/40 border border-emerald-500/20 rounded-xl p-3.5 text-xs text-slate-300">
                Accounts are registered as <strong class="text-emerald-400 font-semibold">Buyer</strong> by default.
            </div>

            <!-- SUBMIT -->
            <button type="submit"
                    class="w-full btn btn-primary py-3 rounded-xl text-sm font-semibold mt-2 shadow-lg shadow-emerald-950/40">
                Register
            </button>

        </form>

        <!-- LOGIN LINK -->
        <p class="text-sm text-center text-slate-300/60 mt-6">
            Already have an account?
            <a th:href="@{/auth/login}" class="text-emerald-400 hover:text-emerald-300 font-semibold underline underline-offset-4 ml-1">
                Login
            </a>
        </p>

    </div>

</div>

<!-- SCRIPTS -->
<div th:replace="~{fragments/scripts :: scripts}"></div>

<!-- THREE.JS & GSAP VIA CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // GSAP Animations
        gsap.to(".hero-card", {
            duration: 1.0,
            opacity: 1,
            y: 0,
            scale: 1,
            ease: "power3.out"
        });
        
        gsap.from(".hero-title", {
            duration: 1.0,
            y: -20,
            opacity: 0,
            delay: 0.2,
            ease: "back.out(1.5)"
        });

        gsap.from(".hero-sub", {
            duration: 0.8,
            opacity: 0,
            delay: 0.4,
            ease: "power2.out"
        });

        gsap.from(".form-field", {
            duration: 0.8,
            y: 15,
            opacity: 0,
            stagger: 0.1,
            delay: 0.5,
            ease: "power3.out"
        });

        // Three.js Particle Environment
        const container = document.getElementById('three-bg');
        if (!container) return;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x064e3b, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Particle field representing organic seeds
        const particleCount = 180;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 18;
            positions[i + 1] = (Math.random() - 0.5) * 12;
            positions[i + 2] = (Math.random() - 0.5) * 10;
            velocities.push({
                y: Math.random() * 0.015 + 0.005,
                x: (Math.random() - 0.5) * 0.01
            });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: 0x10b981,
            size: 0.12,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            particles.rotation.y = elapsedTime * 0.02;

            // Move particles upward
            const pos = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                pos[idx + 1] += velocities[i].y;
                pos[idx] += Math.sin(elapsedTime + i) * 0.003;

                // Reset position when it rises above screen boundaries
                if (pos[idx + 1] > 6) {
                    pos[idx + 1] = -6;
                    pos[idx] = (Math.random() - 0.5) * 18;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();
    });
</script>

</body>
</html>
