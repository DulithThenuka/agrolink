<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{
        fragments/head ::
        head('Register')
}">
</head>

<body class="relative flex items-center justify-center min-h-screen px-4 overflow-hidden bg-gradient-to-br from-green-950 via-emerald-900 to-teal-950 py-12">

<!-- 3D BACKGROUND CANVAS -->
<div id="three-bg" class="absolute inset-0 w-full h-full z-0 pointer-events-none"></div>

<div class="relative w-full max-w-md z-10 hero-card opacity-0 my-auto">

    <!-- GLASS CARD -->
    <div class="bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20">

        <!-- TITLE -->
        <h2 class="text-3xl font-bold text-center text-green-400 mb-2 tracking-wide hero-title">
            Create Account 🌱
        </h2>

        <p class="text-center text-green-200/70 text-sm mb-6 hero-sub">
            Join AgroLink today
        </p>

        <!-- GLOBAL ERROR -->
        <div th:if="${#fields.hasErrors('*')}"
             th:replace="~{
                 components/feedback/alert ::
                 alert('error', 'Please fix the errors below')
             }">
        </div>

        <!-- FORM -->
        <form th:action="@{/auth/register}" th:object="${user}" method="post" class="space-y-4">

            <!-- NAME -->
            <div class="form-field"
                 th:replace="~{
                     components/forms/input ::
                     input(
                         'Full Name',
                         'name',
                         'text',
                         'Enter your full name',
                         *{name},
                         ${#fields.hasErrors('name')}
                             ? #fields.errors('name')[0]
                             : null
                     )
                 }">
            </div>

            <!-- EMAIL -->
            <div class="form-field"
                 th:replace="~{
                     components/forms/input ::
                     input(
                         'Email',
                         'email',
                         'email',
                         'Enter your email',
                         *{email},
                         ${#fields.hasErrors('email')}
                             ? #fields.errors('email')[0]
                             : null
                     )
                 }">
            </div>

            <!-- PASSWORD -->
            <div class="form-field"
                 th:replace="~{
                     components/forms/input ::
                     input(
                         'Password',
                         'password',
                         'password',
                         'Enter password',
                         '',
                         ${#fields.hasErrors('password')}
                             ? #fields.errors('password')[0]
                             : null
                     )
                 }">
            </div>

            <!-- LOCATION -->
            <div class="form-field"
                 th:replace="~{
                     components/forms/input ::
                     input(
                         'Location',
                         'location',
                         'text',
                         'City / Area',
                         *{location},
                         null
                     )
                 }">
            </div>

            <!-- ROLE NOTICE -->
            <div class="form-field bg-green-950/40 border border-green-500/20 rounded-lg p-3 text-xs text-green-300">
                Accounts are registered as <strong class="text-green-400">Buyer</strong> by default.
            </div>

            <!-- SUBMIT -->
            <button type="submit"
                    class="w-full bg-green-500 text-white py-3 rounded-lg hover:bg-green-600 active:scale-[0.98] transition-all font-semibold shadow-lg shadow-green-500/25 mt-2">
                Register
            </button>

        </form>

        <!-- LOGIN LINK -->
        <p class="text-sm text-center text-green-200/60 mt-6">
            Already have an account?
            <a th:href="@{/auth/login}" class="text-green-400 hover:text-green-300 font-semibold underline underline-offset-4 ml-1">
                Login
            </a>
        </p>

    </div>

</div>

<!-- SCRIPTS -->
<div th:replace="~{
    fragments/scripts ::
    scripts
}">
</div>

<!-- THREE.JS & GSAP VIA CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        // GSAP Animations
        gsap.to(".hero-card", {
            duration: 1.0,
            opacity: 1,
            y: 0,
            scale: 1,
            ease: "power3.out"
        });
        
        gsap.from(".hero-title", {
            duration: 1.0,
            y: -20,
            opacity: 0,
            delay: 0.2,
            ease: "back.out(1.5)"
        });

        gsap.from(".hero-sub", {
            duration: 0.8,
            opacity: 0,
            delay: 0.4,
            ease: "power2.out"
        });

        gsap.from(".form-field", {
            duration: 0.8,
            y: 15,
            opacity: 0,
            stagger: 0.1,
            delay: 0.5,
            ease: "power3.out"
        });

        // Three.js Particle Environment
        const container = document.getElementById('three-bg');
        if (!container) return;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x064e3b, 0.01);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Particle field representing organic seeds
        const particleCount = 180;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = [];

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 18;
            positions[i + 1] = (Math.random() - 0.5) * 12;
            positions[i + 2] = (Math.random() - 0.5) * 10;
            velocities.push({
                y: Math.random() * 0.015 + 0.005,
                x: (Math.random() - 0.5) * 0.01
            });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const material = new THREE.PointsMaterial({
            color: 0x34d399,
            size: 0.12,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            particles.rotation.y = elapsedTime * 0.02;

            // Move particles upward
            const pos = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                pos[idx + 1] += velocities[i].y;
                pos[idx] += Math.sin(elapsedTime + i) * 0.003;

                // Reset position when it rises above screen boundaries
                if (pos[idx + 1] > 6) {
                    pos[idx + 1] = -6;
                    pos[idx] = (Math.random() - 0.5) * 18;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();
    });
</script>

</body>

</html>
