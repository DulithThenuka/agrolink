<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{
        fragments/head ::
        head('Register')
}">
</head>

<body
        class="bg-gray-100
               flex items-center
               justify-center
               min-h-screen px-4">

<div
        class="w-full max-w-md">

    <!-- CARD -->
    <div
            class="bg-white rounded-2xl
                   shadow-lg p-8">

        <!-- TITLE -->
        <h2
                class="text-2xl font-bold
                       text-center
                       text-green-600 mb-2">

            Create Account 🌱

        </h2>

        <p
                class="text-center
                       text-gray-500
                       text-sm mb-6">

            Join AgroLink today

        </p>

        <!-- GLOBAL ERROR -->
        <div
                th:if="${#fields.hasErrors('*')}"

                th:replace="~{
                components/feedback/alert ::
                alert(
                'error',
                'Please fix the errors below'
                )
        }">
        </div>

        <!-- FORM -->
        <form
                th:action="@{/auth/register}"
                th:object="${user}"
                method="post"

                class="space-y-4">

            <!-- NAME -->
            <div
                    th:replace="~{
                    components/forms/input ::
                    input(
                    'Full Name',
                    'name',
                    'text',
                    'Enter your full name',
                    *{name},
                    ${#fields.hasErrors('name')}
                        ? #fields.errors('name')[0]
                        : null
                    )
            }">
            </div>

            <!-- EMAIL -->
            <div
                    th:replace="~{
                    components/forms/input ::
                    input(
                    'Email',
                    'email',
                    'email',
                    'Enter your email',
                    *{email},
                    ${#fields.hasErrors('email')}
                        ? #fields.errors('email')[0]
                        : null
                    )
            }">
            </div>

            <!-- PASSWORD -->
            <div
                    th:replace="~{
                    components/forms/input ::
                    input(
                    'Password',
                    'password',
                    'password',
                    'Enter password',
                    '',
                    ${#fields.hasErrors('password')}
                        ? #fields.errors('password')[0]
                        : null
                    )
            }">
            </div>

            <!-- LOCATION -->
            <div
                    th:replace="~{
                    components/forms/input ::
                    input(
                    'Location',
                    'location',
                    'text',
                    'City / Area',
                    *{location},
                    null
                    )
            }">
            </div>

            <!-- ROLE NOTICE -->
            <div
                    class="bg-yellow-50
                           border border-yellow-200
                           rounded-lg p-3
                           text-sm text-yellow-700">

                Accounts are registered
                as <strong>Buyer</strong>
                by default.

            </div>

            <!-- SUBMIT -->
            <button
                    type="submit"

                    class="w-full
                           bg-green-600
                           text-white py-2
                           rounded-lg
                           hover:bg-green-700
                           transition">

                Register

            </button>

        </form>

        <!-- LOGIN -->
        <p
                class="text-sm text-center
                       text-gray-500 mt-6">

            Already have an account?

            <a
                    th:href="@{/auth/login}"

                    class="text-green-600
                           hover:underline">

                Login

            </a>

        </p>

    </div>

</div>

<!-- SCRIPTS -->
<div
        th:replace="~{
        fragments/scripts ::
        scripts
}">
</div>

</body>

</html>
