<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{
        fragments/head ::
        head('Login')
}">
</head>

<body
        class="bg-gray-100
               flex items-center
               justify-center
               min-h-screen px-4">

<div
        class="w-full max-w-md">

    <!-- CARD -->
    <div
            class="bg-white rounded-2xl
                   shadow-lg p-8">

        <!-- TITLE -->
        <h2
                class="text-2xl font-bold
                       text-center
                       text-green-600 mb-2">

            Welcome Back 🌱

        </h2>

        <p
                class="text-center
                       text-gray-500
                       text-sm mb-6">

            Login to your AgroLink account

        </p>

        <!-- SUCCESS MESSAGE -->
        <div
                th:if="${successMessage}"

                th:replace="~{
                components/feedback/alert ::
                alert(
                'success',
                ${successMessage}
                )
        }">
        </div>

        <!-- ERROR MESSAGE -->
        <div
                th:if="${errorMessage}"

                th:replace="~{
                components/feedback/alert ::
                alert(
                'error',
                ${errorMessage}
                )
        }">
        </div>

        <!-- LOGIN FORM -->
        <form
                th:action="@{/auth/login}"
                method="post"

                class="space-y-4">

            <!-- EMAIL -->
            <div
                    th:replace="~{
                    components/forms/input ::
                    input(
                    'Email',
                    'email',
                    'email',
                    'Enter your email',
                    '',
                    null
                    )
            }">
            </div>

            <!-- PASSWORD -->
            <div
                    th:replace="~{
                    components/forms/input ::
                    input(
                    'Password',
                    'password',
                    'password',
                    'Enter your password',
                    '',
                    null
                    )
            }">
            </div>

            <!-- SUBMIT -->
            <button
                    type="submit"

                    class="w-full
                           bg-green-600
                           text-white py-2
                           rounded-lg
                           hover:bg-green-700
                           transition">

                Login

            </button>

        </form>

        <!-- REGISTER -->
        <p
                class="text-sm text-center
                       text-gray-500 mt-6">

            Don’t have an account?

            <a
                    th:href="@{/auth/register}"

                    class="text-green-600
                           hover:underline">

                Register

            </a>

        </p>

    </div>

</div>

<!-- SCRIPTS -->
<div
        th:replace="~{
        fragments/scripts ::
        scripts
}">
</div>

</body>

</html>
