<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{
        fragments/head ::
        head('Add Crop')
}">
</head>

<body>

<!-- BASE LAYOUT -->
<div
        th:replace="~{
        layout/base ::
        base('Add Crop', ~{::content})
}">
</div>

<!-- ================== PAGE CONTENT ================== -->
<div
        th:fragment="content"

        class="max-w-3xl mx-auto">

    <div
            class="bg-white
                   rounded-xl shadow
                   p-6">

        <!-- TITLE -->
        <h2
                class="text-2xl
                       font-bold
                       text-gray-800
                       mb-2">

            Add New Crop 🌾

        </h2>

        <p
                class="text-gray-500
                       text-sm mb-6">

            Add your crop details below

        </p>

        <!-- ERROR ALERT -->
        <div
                th:if="${#fields.hasErrors('*')}"

                th:replace="~{
                components/feedback/alert ::
                alert(
                'error',
                'Please fix the errors below'
                )
        }">
        </div>

        <!-- FORM -->
        <form
                th:action="@{/crops/add}"
                th:object="${crop}"

                method="post"
                enctype="multipart/form-data"

                class="space-y-5">

            <!-- NAME -->
            <div
                    th:replace="~{
                    components/forms/input ::
                    input(
                    'Crop Name',
                    'name',
                    'text',
                    'Enter crop name',
                    *{name},
                    ${#fields.hasErrors('name')}
                        ? #fields.errors('name')[0]
                        : null
                    )
            }">
            </div>

            <!-- CATEGORY -->
            <div
                    th:replace="~{
                    components/forms/input ::
                    input(
                    'Category',
                    'category',
                    'text',
                    'Vegetables, Fruits, Grains...',
                    *{category},
                    null
                    )
            }">
            </div>

            <!-- PRICE -->
            <div
                    th:replace="~{
                    components/forms/input ::
                    input(
                    'Price ($)',
                    'price',
                    'number',
                    '0.00',
                    *{price},
                    ${#fields.hasErrors('price')}
                        ? #fields.errors('price')[0]
                        : null
                    )
            }">
            </div>

            <!-- QUANTITY -->
            <div
                    th:replace="~{
                    components/forms/input ::
                    input(
                    'Quantity',
                    'quantity',
                    'number',
                    'Enter quantity',
                    *{quantity},
                    ${#fields.hasErrors('quantity')}
                        ? #fields.errors('quantity')[0]
                        : null
                    )
            }">
            </div>

            <!-- LOCATION -->
            <div
                    th:replace="~{
                    components/forms/input ::
                    input(
                    'Location',
                    'location',
                    'text',
                    'City / Area',
                    *{location},
                    null
                    )
            }">
            </div>

            <!-- IMAGE -->
            <div>

                <label
                        class="block text-sm
                               text-gray-600
                               mb-1">

                    Crop Image

                </label>

                <input
                        type="file"
                        name="image"
                        accept="image/*"

                        class="w-full
                               border rounded-lg
                               p-2"/>

                <p
                        class="text-xs
                               text-gray-400
                               mt-1">

                    Upload JPG / PNG / WEBP image

                </p>

            </div>

            <!-- BUTTONS -->
            <div
                    class="flex justify-between
                           items-center mt-6">

                <!-- BACK -->
                <a
                        th:href="@{/crops}"

                        class="text-gray-600
                               hover:underline">

                    ← Back

                </a>

                <!-- SUBMIT -->
                <button
                        type="submit"

                        class="bg-green-600
                               text-white
                               px-5 py-2
                               rounded-lg
                               hover:bg-green-700
                               transition">

                    Save Crop

                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
