<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{
        fragments/head ::
        head('Crops')
        }">
</head>

<body class="bg-slate-50">

<!-- BASE LAYOUT -->
<div th:replace="~{layout/base :: base('Crops', ~{::content})}"></div>

<!-- ================== PAGE CONTENT ================== -->
<div th:fragment="content" class="max-w-7xl mx-auto space-y-8 animate-fade-in-up">

    <!-- HEADER & SEARCH -->
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6 pb-6 border-b border-slate-200/60">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 font-display">Produce Marketplace 🌾</h1>
            <p class="text-slate-500 text-sm mt-1">Discover, order, or sell fresh organic agriculture harvests directly.</p>
        </div>

        <!-- SEARCH -->
        <form method="get" th:action="@{/crops}" class="flex gap-2">
            <input
                    type="text"
                    name="keyword"
                    th:value="${keyword}"
                    placeholder="Search crops..."
                    class="px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200 text-sm w-full md:w-64"/>

            <button type="submit" class="btn btn-primary px-5 py-2.5 shadow-sm">
                Search
            </button>
        </form>
    </div>

    <!-- QUICK CATEGORY PILLS -->
    <div class="flex flex-wrap gap-2.5 items-center">
        <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 mr-1">Filter Category:</span>
        <a th:href="@{/crops}" class="px-4 py-2 rounded-xl text-xs font-bold transition border"
           th:classappend="${category == null || category == ''} ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-500/20' : 'bg-white text-slate-700 border-slate-200 hover:bg-emerald-50 hover:text-emerald-700'">
            All Yields
        </a>
        <a th:href="@{/crops(category='Vegetables')}" class="px-4 py-2 rounded-xl text-xs font-bold transition border"
           th:classappend="${category == 'Vegetables'} ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-500/20' : 'bg-white text-slate-700 border-slate-200 hover:bg-emerald-50 hover:text-emerald-700'">
            🥬 Vegetables
        </a>
        <a th:href="@{/crops(category='Grains')}" class="px-4 py-2 rounded-xl text-xs font-bold transition border"
           th:classappend="${category == 'Grains'} ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-500/20' : 'bg-white text-slate-700 border-slate-200 hover:bg-emerald-50 hover:text-emerald-700'">
            🌾 Grains &amp; Cereals
        </a>
        <a th:href="@{/crops(category='Fruits')}" class="px-4 py-2 rounded-xl text-xs font-bold transition border"
           th:classappend="${category == 'Fruits'} ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-500/20' : 'bg-white text-slate-700 border-slate-200 hover:bg-emerald-50 hover:text-emerald-700'">
            🍎 Fruits
        </a>
        <a th:href="@{/crops(category='Spices')}" class="px-4 py-2 rounded-xl text-xs font-bold transition border"
           th:classappend="${category == 'Spices'} ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-500/20' : 'bg-white text-slate-700 border-slate-200 hover:bg-emerald-50 hover:text-emerald-700'">
            🌶️ Spices
        </a>
    </div>


    <!-- FILTERS -->
    <div class="premium-card p-6 bg-white border border-slate-100">
        <form method="get" th:action="@{/crops}" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 items-end">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Category</label>
                <input type="text" name="category" th:value="${category}" placeholder="e.g. Vegetables"
                       class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Location</label>
                <input type="text" name="location" th:value="${location}" placeholder="e.g. California"
                       class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Min Price ($)</label>
                <input type="number" name="minPrice" th:value="${minPrice}" placeholder="0"
                       class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Max Price ($)</label>
                <input type="number" name="maxPrice" th:value="${maxPrice}" placeholder="1000"
                       class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200 text-sm">
            </div>

            <button type="submit" class="btn btn-secondary w-full py-2.5 font-bold">
                Apply Filters
            </button>
        </form>
    </div>

    <!-- EMPTY STATE -->
    <div th:if="${#lists.isEmpty(crops.content)}" class="py-12">
        <div th:replace="~{components/feedback/empty-state :: empty('No Crops Found', 'Try adjusting your filters or keyword parameters.', 'Reset Filters', '/crops')}"></div>
    </div>

    <!-- GRID -->
    <div th:unless="${#lists.isEmpty(crops.content)}"
         class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <th:block th:each="crop : ${crops.content}">
            <div th:replace="~{components/cards/crop-card :: cropCard(${crop})}"></div>
        </th:block>
    </div>

    <!-- PAGINATION -->
    <div th:unless="${#lists.isEmpty(crops.content)}" class="flex justify-center items-center mt-12 gap-3">
        <!-- PREVIOUS -->
        <a th:if="${crops.hasPrevious()}"
           th:href="@{/crops(
               page=${currentPage - 1},
               keyword=${keyword},
               category=${category},
               location=${location},
               minPrice=${minPrice},
               maxPrice=${maxPrice}
           )}"
           class="btn btn-secondary py-2 px-4 text-xs font-bold shadow-sm">
            Previous
        </a>

        <!-- CURRENT PAGE NUMBER -->
        <span class="px-4 py-2 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-700 text-xs font-bold"
              th:text="${currentPage + 1}">
            1
        </span>

        <!-- NEXT -->
        <a th:if="${crops.hasNext()}"
           th:href="@{/crops(
               page=${currentPage + 1},
               keyword=${keyword},
               category=${category},
               location=${location},
               minPrice=${minPrice},
               maxPrice=${maxPrice}
           )}"
           class="btn btn-secondary py-2 px-4 text-xs font-bold shadow-sm">
            Next
        </a>
    </div>

</div>

</body>
</html>
