<!DOCTYPE html>
<html
        lang="en"
        xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{
        fragments/head ::
        head('Crops')
        }">
</head>

<body class="bg-slate-50">

<!-- BASE LAYOUT -->
<div th:replace="~{layout/base :: base('Crops', ~{::content})}"></div>

<!-- ================== PAGE CONTENT ================== -->
<div th:fragment="content" class="max-w-7xl mx-auto space-y-8 animate-fade-in-up">

    <!-- HEADER & SEARCH -->
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6 pb-6 border-b border-slate-200/60">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 font-display">Produce Marketplace 🌾</h1>
            <p class="text-slate-500 text-sm mt-1">Discover, order, or sell fresh organic agriculture harvests directly.</p>
        </div>

        <!-- SEARCH -->
        <form method="get" th:action="@{/crops}" class="flex gap-2">
            <input
                    type="text"
                    name="keyword"
                    th:value="${keyword}"
                    placeholder="Search crops..."
                    class="px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition duration-200 text-sm w-full md:w-64"/>

            <button type="submit" class="btn btn-primary px-5 py-2.5 shadow-sm">
                Search
            </button>
        </form>
    </div>

    <!-- QUICK CATEGORY PILLS -->
    <div class="flex flex-wrap gap-2.5 items-center">
        <span class="text-xs font-extrabold uppercase tracking-wider text-slate-400 mr-1">Filter Category:</span>
        <a th:href="@{/crops(keyword=${keyword}, location=${location}, minPrice=${minPrice}, maxPrice=${maxPrice})}" class="px-4 py-2 rounded-xl text-xs font-bold transition border"
           th:classappend="${category == null || category == ''} ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-500/20' : 'bg-white text-slate-700 border-slate-200 hover:bg-emerald-50 hover:text-emerald-700'">
            All Yields
        </a>
        <a th:href="@{/crops(category='Vegetables', keyword=${keyword}, location=${location}, minPrice=${minPrice}, maxPrice=${maxPrice})}" class="px-4 py-2 rounded-xl text-xs font-bold transition border"
           th:classappend="${category == 'Vegetables'} ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-500/20' : 'bg-white text-slate-700 border-slate-200 hover:bg-emerald-50 hover:text-emerald-700'">
            🥬 Vegetables
        </a>
        <a th:href="@{/crops(category='Grains', keyword=${keyword}, location=${location}, minPrice=${minPrice}, maxPrice=${maxPrice})}" class="px-4 py-2 rounded-xl text-xs font-bold transition border"
           th:classappend="${category == 'Grains'} ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-500/20' : 'bg-white text-slate-700 border-slate-200 hover:bg-emerald-50 hover:text-emerald-700'">
            🌾 Grains &amp; Cereals
        </a>
        <a th:href="@{/crops(category='Fruits', keyword=${keyword}, location=${location}, minPrice=${minPrice}, maxPrice=${maxPrice})}" class="px-4 py-2 rounded-xl text-xs font-bold transition border"
           th:classappend="${category == 'Fruits'} ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-500/20' : 'bg-white text-slate-700 border-slate-200 hover:bg-emerald-50 hover:text-emerald-700'">
            🍎 Fruits
        </a>
        <a th:href="@{/crops(category='Spices', keyword=${keyword}, location=${location}, minPrice=${minPrice}, maxPrice=${maxPrice})}" class="px-4 py-2 rounded-xl text-xs font-bold transition border"
           th:classappend="${category == 'Spices'} ? 'bg-emerald-600 text-white border-emerald-600 shadow-md shadow-emerald-500/20' : 'bg-white text-slate-700 border-slate-200 hover:bg-emerald-50 hover:text-emerald-700'">
            🌶️ Spices
        </a>
    </div>

    <!-- FILTERS -->
    <div class="glass p-6 rounded-3xl bg-white/80 border border-slate-200/80 shadow-lg">
        <form method="get" th:action="@{/crops}" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 items-end">
            <input type="hidden" name="keyword" th:value="${keyword}" th:if="${keyword != null}"/>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Category</label>
                <input type="text" name="category" th:value="${category}" placeholder="e.g. Vegetables"
                       class="input-premium">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Agricultural District 🇱🇰</label>
                <select name="location" class="input-premium bg-white cursor-pointer">
                    <option value="" th:selected="${location == null || location == ''}">All Sri Lanka Districts 📍</option>
                    <option value="Nuwara Eliya" th:selected="${location == 'Nuwara Eliya'}">📍 Nuwara Eliya</option>
                    <option value="Jaffna" th:selected="${location == 'Jaffna'}">📍 Jaffna</option>
                    <option value="Kandy" th:selected="${location == 'Kandy'}">📍 Kandy</option>
                    <option value="Galle" th:selected="${location == 'Galle'}">📍 Galle</option>
                    <option value="Hambantota" th:selected="${location == 'Hambantota'}">📍 Hambantota</option>
                    <option value="Anuradhapura" th:selected="${location == 'Anuradhapura'}">📍 Anuradhapura</option>
                    <option value="Polonnaruwa" th:selected="${location == 'Polonnaruwa'}">📍 Polonnaruwa</option>
                    <option value="Badulla" th:selected="${location == 'Badulla'}">📍 Badulla</option>
                    <option value="Dambulla" th:selected="${location == 'Dambulla'}">📍 Dambulla</option>
                    <option value="Matale" th:selected="${location == 'Matale'}">📍 Matale</option>
                    <option value="Kurunegala" th:selected="${location == 'Kurunegala'}">📍 Kurunegala</option>
                    <option value="Ratnapura" th:selected="${location == 'Ratnapura'}">📍 Ratnapura</option>
                    <option value="Kegalle" th:selected="${location == 'Kegalle'}">📍 Kegalle</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Min Price (Rs.)</label>
                <input type="number" name="minPrice" th:value="${minPrice}" placeholder="0"
                       class="input-premium">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wider">Max Price (Rs.)</label>
                <input type="number" name="maxPrice" th:value="${maxPrice}" placeholder="1000"
                       class="input-premium">
            </div>

            <button type="submit" class="btn btn-primary w-full py-3 font-bold shadow-md shadow-emerald-500/20">
                Apply Filters
            </button>
        </form>
    </div>

    <!-- EMPTY STATE -->
    <div th:if="${#lists.isEmpty(crops.content)}" class="py-12">
        <div th:replace="~{components/feedback/empty-state :: empty('No Crops Found', 'Try adjusting your filters or keyword parameters.', 'Reset Filters', '/crops')}"></div>
    </div>

    <!-- GRID -->
    <div th:unless="${#lists.isEmpty(crops.content)}"
         class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <th:block th:each="crop : ${crops.content}">
            <div th:replace="~{components/cards/crop-card :: cropCard(${crop})}"></div>
        </th:block>
    </div>

    <!-- PAGINATION -->
    <div th:unless="${#lists.isEmpty(crops.content)}" class="flex justify-center items-center mt-12 gap-3">
        <!-- PREVIOUS -->
        <a th:if="${crops.hasPrevious()}"
           th:href="@{/crops(
               page=${currentPage - 1},
               keyword=${keyword},
               category=${category},
               location=${location},
               minPrice=${minPrice},
               maxPrice=${maxPrice}
           )}"
           class="btn btn-secondary py-2 px-4 text-xs font-bold shadow-sm">
            Previous
        </a>

        <!-- CURRENT PAGE NUMBER -->
        <span class="px-4 py-2 rounded-xl bg-emerald-50 border border-emerald-100 text-emerald-700 text-xs font-bold"
              th:text="${currentPage + 1}">
            1
        </span>

        <!-- NEXT -->
        <a th:if="${crops.hasNext()}"
           th:href="@{/crops(
               page=${currentPage + 1},
               keyword=${keyword},
               category=${category},
               location=${location},
               minPrice=${minPrice},
               maxPrice=${maxPrice}
           )}"
           class="btn btn-secondary py-2 px-4 text-xs font-bold shadow-sm">
            Next
        </a>
    </div>

</div>

</body>
</html>
