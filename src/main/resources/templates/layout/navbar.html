<div
        th:fragment="navbar"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        xmlns:th="http://www.thymeleaf.org">

    <div
            x-data="{
                open: false,
                userMenu: false
            }">

        <!-- FLOATING STICKY NAVBAR -->
        <header class="sticky top-0 z-50 px-4 sm:px-8 py-3 transition-all duration-300">
            <nav class="max-w-7xl mx-auto glass rounded-2xl px-5 py-3.5 flex justify-between items-center border border-white/60 shadow-lg shadow-emerald-950/5 backdrop-blur-xl">

                <!-- LOGO WITH GLOW -->
                <a th:href="@{/}" class="text-2xl font-extrabold tracking-tight text-slate-900 flex items-center gap-2.5 font-display group">
                    <span class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 flex items-center justify-center text-xl shadow-sm group-hover:scale-110 group-hover:bg-emerald-500 group-hover:text-white transition-all duration-300">🌱</span>
                    <span class="tracking-tight">Agro<span class="text-emerald-600 group-hover:text-teal-600 transition duration-300">Link</span></span>
                    <span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-emerald-100 text-emerald-800 border border-emerald-200/60">Direct Trade</span>
                </a>

                <!-- DESKTOP MENU -->
                <div class="hidden md:flex items-center space-x-1 font-semibold text-slate-600 text-sm">

                    <!-- CROPS -->
                    <a th:href="@{/crops}"
                       class="px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-1.5 hover:text-emerald-600 hover:bg-emerald-50/60"
                       th:classappend="${currentUri != null && currentUri.startsWith('/crops')}
                           ? ' text-emerald-700 bg-emerald-50 font-bold border border-emerald-200/50'
                           : ''">
                        <span>🌾 Marketplace</span>
                    </a>

                    <!-- BUYER ONLY -->
                    <a sec:authorize="hasRole('BUYER')"
                       th:href="@{/orders/my}"
                       class="px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-1.5 hover:text-emerald-600 hover:bg-emerald-50/60"
                       th:classappend="${currentUri != null && currentUri.startsWith('/orders')}
                           ? ' text-emerald-700 bg-emerald-50 font-bold border border-emerald-200/50'
                           : ''">
                        <span>📦 Orders</span>
                    </a>

                    <!-- ANALYTICS -->
                    <a th:href="@{/analytics}"
                       class="px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-1.5 hover:text-emerald-600 hover:bg-emerald-50/60"
                       th:classappend="${currentUri != null && currentUri.startsWith('/analytics')}
                           ? ' text-emerald-700 bg-emerald-50 font-bold border border-emerald-200/50'
                           : ''">
                        <span>📈 Analytics</span>
                    </a>

                    <!-- AI ADVISOR -->
                    <a th:href="@{/advisor}"
                       class="px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-1.5 hover:text-emerald-600 hover:bg-emerald-50/60"
                       th:classappend="${currentUri != null && currentUri.startsWith('/advisor')}
                           ? ' text-emerald-700 bg-emerald-50 font-bold border border-emerald-200/50'
                           : ''">
                        <span>🤖 AI Advisor</span>
                    </a>

                    <!-- PRICE PREDICTOR -->
                    <a th:href="@{/price-prediction}"
                       class="px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-1.5 hover:text-emerald-600 hover:bg-emerald-50/60"
                       th:classappend="${currentUri != null && currentUri.startsWith('/price-prediction')}
                           ? ' text-emerald-700 bg-emerald-50 font-bold border border-emerald-200/50'
                           : ''">
                        <span>📈 Price Predictor</span>
                    </a>

                    <!-- DEMAND FORECASTING -->
                    <a th:href="@{/demand-forecasting}"
                       class="px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-1.5 hover:text-emerald-600 hover:bg-emerald-50/60"
                       th:classappend="${currentUri != null && currentUri.startsWith('/demand-forecasting')}
                           ? ' text-emerald-700 bg-emerald-50 font-bold border border-emerald-200/50'
                           : ''">
                        <span>📊 Demand Forecast</span>
                    </a>




                    <!-- DASHBOARD -->
                    <a sec:authorize="isAuthenticated()"
                       th:href="@{/dashboard}"
                       class="px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-1.5 hover:text-emerald-600 hover:bg-emerald-50/60"
                       th:classappend="${currentUri != null && currentUri.startsWith('/dashboard')}
                           ? ' text-emerald-700 bg-emerald-50 font-bold border border-emerald-200/50'
                           : ''">
                        <span>📊 Dashboard</span>
                    </a>


                </div>

                <!-- RIGHT ACTION AREA -->
                <div class="hidden md:flex items-center space-x-3">
                    <!-- ANONYMOUS ACCESS -->
                    <a sec:authorize="isAnonymous()"
                       th:href="@{/auth/login}"
                       class="px-4 py-2 text-sm font-semibold text-slate-700 hover:text-emerald-600 transition">
                        Sign In
                    </a>

                    <a sec:authorize="isAnonymous()"
                       th:href="@{/auth/register}"
                       class="btn btn-primary py-2.5 px-5 text-xs shadow-md shadow-emerald-500/20">
                        Get Started →
                    </a>

                    <!-- AUTHENTICATED USER MENU -->
                    <div sec:authorize="isAuthenticated()" class="relative">
                        <button @click="userMenu = !userMenu"
                                class="flex items-center gap-2.5 px-4 py-2 rounded-xl bg-slate-100/90 hover:bg-emerald-50 border border-slate-200/60 transition duration-200 text-sm font-semibold text-slate-800 shadow-sm">
                            <div class="w-7 h-7 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs font-bold shadow-sm">
                                🧑‍🌾
                            </div>
                            <span th:text="${#authentication.name}" class="max-w-[120px] truncate">User</span>
                            <svg class="w-4 h-4 text-slate-400 transition-transform duration-200" :class="{'rotate-180': userMenu}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>

                        <!-- DROPDOWN -->
                        <div x-show="userMenu"
                             @click.away="userMenu = false"
                             x-transition:enter="transition ease-out duration-150"
                             x-transition:enter-start="transform opacity-0 scale-95 translateY(-10px)"
                             x-transition:enter-end="transform opacity-100 scale-100 translateY(0)"
                             x-transition:leave="transition ease-in duration-100"
                             x-transition:leave-start="transform opacity-100 scale-100 translateY(0)"
                             x-transition:leave-end="transform opacity-0 scale-95 translateY(-10px)"
                             style="display:none"
                             class="absolute right-0 mt-3 w-56 bg-white rounded-2xl shadow-2xl border border-slate-100 p-2 z-50">
                            
                            <div class="px-4 py-3 border-b border-slate-100">
                                <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Signed in as</p>
                                <p class="text-sm font-bold text-slate-900 truncate mt-0.5" th:text="${#authentication.name}">user@example.com</p>
                            </div>

                            <div class="py-1">
                                <a th:href="@{/profile}"
                                   class="flex items-center gap-2.5 px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 rounded-xl transition">
                                    <span>👤 My Profile</span>
                                </a>

                                <a th:href="@{/dashboard}"
                                   class="flex items-center gap-2.5 px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 rounded-xl transition">
                                    <span>📊 Overview</span>
                                </a>
                            </div>

                            <div class="h-px bg-slate-100 my-1"></div>

                            <!-- LOGOUT -->
                            <form th:action="@{/logout}" method="post">
                                <button type="submit"
                                        class="w-full flex items-center gap-2.5 text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 rounded-xl transition font-semibold">
                                    <span>🚪 Logout</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- MOBILE BUTTON -->
                <button @click="open = !open" class="md:hidden w-10 h-10 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center hover:bg-emerald-50 hover:text-emerald-600 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

            </nav>
        </header>

        <!-- MOBILE MENU -->
        <div x-show="open"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 translateY(-10px)"
             x-transition:enter-end="opacity-100 translateY(0)"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 translateY(0)"
             x-transition:leave-end="opacity-0 translateY(-10px)"
             style="display:none"
             class="md:hidden px-4 mb-4 z-40 relative">
            <div class="glass rounded-2xl shadow-xl border border-white/60 p-4 space-y-2">

                <a th:href="@{/crops}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-semibold hover:bg-emerald-50 hover:text-emerald-700">
                    <span>🌾 Crops Marketplace</span>
                </a>

                <!-- BUYER ONLY -->
                <a sec:authorize="hasRole('BUYER')" th:href="@{/orders/my}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-semibold hover:bg-emerald-50 hover:text-emerald-700">
                    <span>📦 My Orders</span>
                </a>

                <a sec:authorize="isAuthenticated()" th:href="@{/dashboard}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-semibold hover:bg-emerald-50 hover:text-emerald-700">
                    <span>📊 Dashboard</span>
                </a>

                <a sec:authorize="isAuthenticated()" th:href="@{/profile}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-semibold hover:bg-emerald-50 hover:text-emerald-700">
                    <span>👤 Profile</span>
                </a>

                <div sec:authorize="isAnonymous()" class="pt-2 border-t border-slate-200/60 space-y-2">
                    <a th:href="@{/auth/login}" class="block px-4 py-3 rounded-xl text-slate-700 font-semibold hover:bg-slate-50 text-center">
                        Sign In
                    </a>

                    <a th:href="@{/auth/register}" class="block px-4 py-3 rounded-xl text-center btn btn-primary text-sm w-full">
                        Get Started Now
                    </a>
                </div>

                <!-- LOGOUT -->
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="pt-2 border-t border-slate-200/60">
                    <button type="submit" class="w-full text-left px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl font-semibold flex items-center gap-2">
                        <span>🚪 Logout</span>
                    </button>
                </form>

            </div>
        </div>

    </div>

</div>
