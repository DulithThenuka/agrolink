<div
        th:fragment="footer"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <footer
            class="mt-10 bg-white border-t">

        <div
                class="max-w-7xl mx-auto
                       px-6 py-6
                       flex flex-col
                       md:flex-row
                       justify-between
                       items-center
                       gap-4">

            <!-- BRAND -->
            <div
                    class="text-gray-600 text-sm">

                ©
                <span
                        th:text="${#temporals.year(
                            T(java.time.LocalDateTime).now()
                        )}">
                </span>

                AgroLink.
                All rights reserved.

            </div>

            <!-- NAV LINKS -->
            <div
                    class="flex flex-wrap
                           justify-center
                           gap-5 text-sm
                           text-gray-500">

                <!-- HOME -->
                <a
                        th:href="@{/}"

                        class="hover:text-green-600
                               transition">

                    Home

                </a>

                <!-- CROPS -->
                <a
                        th:href="@{/crops}"

                        class="hover:text-green-600
                               transition">

                    Crops

                </a>

                <!-- BUYER ONLY -->
                <a
                        sec:authorize="hasRole('BUYER')"

                        th:href="@{/orders/my}"

                        class="hover:text-green-600
                               transition">

                    My Orders

                </a>

                <!-- AUTHENTICATED USERS -->
                <a
                        sec:authorize="isAuthenticated()"

                        th:href="@{/profile}"

                        class="hover:text-green-600
                               transition">

                    Profile

                </a>

            </div>

            <!-- EXTRA -->
            <div
                    class="text-xs text-gray-400
                           text-center">

                Built with ❤️ using
                Spring Boot &
                Thymeleaf

            </div>

        </div>

    </footer>

</div>
