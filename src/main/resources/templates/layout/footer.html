<div
        th:fragment="footer"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        xmlns:th="http://www.thymeleaf.org">

    <footer class="bg-white border-t border-slate-200/60 mt-auto">
        <div class="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row justify-between items-center gap-4">

            <!-- BRAND -->
            <div class="text-slate-500 text-sm font-medium">
                &copy; <span th:text="${#temporals.year(T(java.time.LocalDateTime).now())}">2026</span> 
                AgroLink. All rights reserved.
            </div>

            <!-- NAV LINKS -->
            <div class="flex flex-wrap justify-center gap-6 text-sm font-semibold text-slate-500">
                <a th:href="@{/}" class="hover:text-emerald-600 transition">
                    Home
                </a>
                <a th:href="@{/crops}" class="hover:text-emerald-600 transition">
                    Crops
                </a>
                <a sec:authorize="hasRole('BUYER')" th:href="@{/orders/my}" class="hover:text-emerald-600 transition">
                    My Orders
                </a>
                <a sec:authorize="isAuthenticated()" th:href="@{/profile}" class="hover:text-emerald-600 transition">
                    Profile
                </a>
            </div>

            <!-- EXTRA -->
            <div class="text-xs text-slate-400 font-medium">
                Built with 💚 using Spring Boot &amp; Tailwind
            </div>

        </div>
    </footer>

</div>
