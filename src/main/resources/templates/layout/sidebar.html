<div
        th:fragment="sidebar"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div
            x-data="{
                open: true,
                mobileOpen: false
            }"
            class="flex">

        <!-- ================== MOBILE OVERLAY ================== -->
        <div
                x-show="mobileOpen"
                @click="mobileOpen = false"

                style="display:none"

                class="fixed inset-0
                       bg-black bg-opacity-40
                       z-40 md:hidden">

        </div>

        <!-- ================== DESKTOP SIDEBAR ================== -->
        <aside

                :class="open ? 'w-64' : 'w-20'"

                class="hidden md:flex
                       flex-col h-screen
                       bg-white border-r
                       shadow-sm
                       transition-all
                       duration-300 z-50">

            <!-- HEADER -->
            <div
                    class="flex items-center
                           justify-between
                           px-4 py-4">

                <h2
                        x-show="open"

                        class="text-lg font-bold
                               text-gray-700">

                    Menu

                </h2>

                <!-- COLLAPSE BUTTON -->
                <button
                        type="button"
                        @click="open = !open"

                        class="text-gray-500
                               hover:text-gray-700">

                    <span x-show="open">
                        ◀
                    </span>

                    <span x-show="!open">
                        ▶
                    </span>

                </button>

            </div>

            <!-- MENU -->
            <nav
                    class="flex-1 px-2
                           space-y-2
                           text-sm font-medium">

                <!-- CROPS -->
                <a
                        th:href="@{/crops}"

                        th:classappend="${currentUri != null && currentUri.startsWith('/crops')}
                            ? ' bg-green-100 text-green-700'
                            : ' text-gray-600'"

                        class="flex items-center
                               gap-3 px-3 py-2
                               rounded-lg
                               hover:bg-gray-100
                               transition">

                    <span>🌾</span>
                    <span x-show="open">
                        Crops
                    </span>

                </a>

                <!-- BUYER ONLY -->
                <a
                        sec:authorize="hasRole('BUYER')"

                        th:href="@{/orders/my}"

                        th:classappend="${currentUri != null && currentUri.startsWith('/orders')}
                            ? ' bg-green-100 text-green-700'
                            : ' text-gray-600'"

                        class="flex items-center
                               gap-3 px-3 py-2
                               rounded-lg
                               hover:bg-gray-100
                               transition">

                    <span>📦</span>
                    <span x-show="open">
                        Orders
                    </span>

                </a>

                <!-- FARMER ONLY -->
                <a
                        sec:authorize="hasRole('FARMER')"

                        th:href="@{/crops/add}"

                        th:classappend="${currentUri != null && currentUri.contains('/add')}
                            ? ' bg-green-100 text-green-700'
                            : ' text-gray-600'"

                        class="flex items-center
                               gap-3 px-3 py-2
                               rounded-lg
                               hover:bg-gray-100
                               transition">

                    <span>➕</span>
                    <span x-show="open">
                        Add Crop
                    </span>

                </a>

            </nav>

            <!-- FOOTER -->
            <div
                    x-show="open"

                    class="px-4 py-4
                           border-t text-xs
                           text-gray-400
                           text-center">

                AgroLink v1.0

            </div>

        </aside>

        <!-- ================== MOBILE TOGGLE ================== -->
        <button
                type="button"
                @click="mobileOpen = true"

                class="fixed bottom-5 left-5
                       md:hidden
                       bg-green-600
                       text-white
                       p-3 rounded-full
                       shadow-lg z-50">

            ☰

        </button>

        <!-- ================== MOBILE SIDEBAR ================== -->
        <aside
                x-show="mobileOpen"
                x-transition

                style="display:none"

                class="fixed left-0 top-0
                       h-full w-64
                       bg-white
                       shadow-lg
                       z-50 md:hidden">

            <div
                    class="flex justify-between
                           items-center
                           p-4 border-b">

                <span
                        class="font-bold text-gray-700">

                    Menu

                </span>

                <button
                        type="button"
                        @click="mobileOpen = false">

                    ✕

                </button>

            </div>

            <nav
                    class="px-4 py-3
                           space-y-2">

                <a
                        th:href="@{/crops}"

                        class="block py-2
                               hover:text-green-600">

                    Crops

                </a>

                <!-- BUYER ONLY -->
                <a
                        sec:authorize="hasRole('BUYER')"

                        th:href="@{/orders/my}"

                        class="block py-2
                               hover:text-green-600">

                    Orders

                </a>

                <!-- FARMER ONLY -->
                <a
                        sec:authorize="hasRole('FARMER')"

                        th:href="@{/crops/add}"

                        class="block py-2
                               hover:text-green-600">

                    Add Crop

                </a>

            </nav>

        </aside>

    </div>

</div>
